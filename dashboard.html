
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | EduGM Admin</title>
<link rel="icon" href="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png">
<link rel="stylesheet" href="css/style.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f8ff;color:#172554;font:14px/1.6 Arial,sans-serif}
a{text-decoration:none;color:#2457d6}
#app-shell .sidebar{position:fixed;inset:0 auto 0 0;width:250px;padding:22px 16px;background:#fff;border-right:1px solid #e5eaf3;display:flex;flex-direction:column;z-index:10}
#app-shell .side-brand{display:flex;align-items:center;gap:12px;padding:0 8px 25px;font-weight:700}
#app-shell .sidebar-logo{width:44px!important;height:44px!important;max-width:44px!important;object-fit:contain;flex-shrink:0}
#app-shell .nav-label{padding:10px;color:#94a3b8;font-size:10px;font-weight:700;letter-spacing:2px}
#app-shell .side-nav{display:grid;gap:6px}
#app-shell .side-nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;color:#475569}
#app-shell .side-nav a:hover,#app-shell .side-nav a.active{background:#edf4ff;color:#2457d6}
#app-shell .side-nav a span{width:20px;text-align:center}
#app-shell .side-bottom{margin-top:auto;border-top:1px solid #e5eaf3;padding-top:15px}
#app-shell .user-mini{font-size:11px;color:#64748b;overflow-wrap:anywhere;margin-bottom:12px}
#app-shell button{cursor:pointer}
.main-content{margin-left:250px;padding:32px;max-width:1600px;min-height:100vh}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
.page-head h1{font-size:30px;margin:0 0 6px}
.eyebrow{font-size:10px;letter-spacing:2px;color:#2457d6;font-weight:700}
.muted{color:#64748b}
.btn,.mini-btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #e1e8f3;border-radius:10px;background:white;font-weight:600;font-size:12px}
.btn.primary{background:#2457d6;color:white;border-color:#2457d6}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat-card,.panel{background:white;border:1px solid #e5eaf3;border-radius:16px;box-shadow:0 8px 25px #1e40af0a}
.stat-card{padding:20px}
.stat-card span{display:block;color:#64748b;font-size:12px}
.stat-card strong{display:block;font-size:30px;margin-top:6px}
.panel{padding:22px;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.panel-head h2{font-size:17px;margin:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #edf1f7;font-size:12px}
th{background:#f8faff;color:#64748b;font-size:10px;text-transform:uppercase}
td strong,td small{display:block}
td small{color:#64748b;margin-top:3px}
.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#fff3d4;color:#956300;font-size:10px;font-weight:bold}
.pill.green{background:#e7f8ee;color:#16845b}
.empty-state{text-align:center;padding:26px;color:#64748b}
.notice{padding:12px;border-radius:10px;background:#fff0ee;color:#b42318}
.hidden{display:none!important}
@media(max-width:1000px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main-content{padding:24px}}
@media(max-width:720px){
#app-shell .sidebar{position:relative;width:100%;height:auto;display:block;padding:12px}
#app-shell .side-brand{padding-bottom:12px}
#app-shell .side-nav{display:flex;overflow-x:auto}
#app-shell .side-nav a{white-space:nowrap}
#app-shell .nav-label,#app-shell .side-bottom{display:none}
.main-content{margin:0;padding:18px}
.page-head{align-items:flex-start;flex-direction:column}
.panel{padding:15px}
}
</style>
</head>

<body>
<div id="app-shell"></div>

<main class="main-content">
  <header class="page-head">
    <div>
      <p class="eyebrow">OVERVIEW</p>
      <h1>Dashboard</h1>
      <p class="muted">Welcome to your EduGM publishing workspace.</p>
    </div>
    <a class="btn primary" href="editor.html">＋ Write article</a>
  </header>

  <section class="stats-grid">
    <article class="stat-card"><span>All articles</span><strong id="stat-all">—</strong></article>
    <article class="stat-card"><span>Published</span><strong id="stat-published">—</strong></article>
    <article class="stat-card"><span>Drafts</span><strong id="stat-drafts">—</strong></article>
    <article class="stat-card owner-only hidden"><span>Pending approvals</span><strong id="stat-pending">—</strong></article>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Recently updated articles</h2>
      <a href="articles.html">View all →</a>
    </div>
    <div id="recent-articles" class="table-wrap">
      <p class="muted">Loading articles…</p>
    </div>
  </section>

  <section class="panel owner-only hidden">
    <div class="panel-head">
      <h2>Pending official accounts</h2>
      <a href="users.html">Manage users →</a>
    </div>
    <div id="pending-users"><p class="muted">Loading…</p></div>
  </section>
</main>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
