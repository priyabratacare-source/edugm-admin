<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduGM Store — Admin</title><link rel="icon" type="image/png" href="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png"><link rel="stylesheet" href="css/style.css"></head><body><div id="app-shell"></div><main class="main-content">
<header class="page-head"><div><p class="eyebrow">COMMERCE</p><h1>EduGM Store</h1><p class="muted">Manage books, notes, study materials, and other store listings.</p></div></header>
<section class="panel"><h2>Add store item</h2><form id="store-form" class="stack"><input id="store-id" type="hidden"><div class="form-grid"><label>Item name<input id="store-title" required maxlength="150" placeholder="Item title"></label><label>Type<select id="store-type"><option>PDF Notes</option><option>Book</option><option>Course</option><option>Printed Material</option><option>Other</option></select></label></div><label>Description<textarea id="store-description" rows="3" placeholder="Describe the resource"></textarea></label><div class="form-grid"><label>Price (₹; 0 for free)<input id="store-price" type="number" min="0" step="1" value="0" required></label><label>Product / download URL<input id="store-url" type="url" placeholder="https://…"></label></div><label>Visibility<select id="store-status"><option value="draft">Draft / hidden</option><option value="published">Published</option></select></label><div class="button-row"><button class="btn primary" type="submit">Save store item</button><button class="btn" type="button" id="clear-store">Clear</button></div><p id="store-message" class="notice hidden"></p></form></section>
<section class="panel"><h2>Store catalogue</h2><div id="store-list">Loading…</div></section>
<script type="module" src="js/store.js"></script></main></body></html>
