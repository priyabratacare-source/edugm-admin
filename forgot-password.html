<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6546e8">
  <title>Forgot Password | EduGM</title>

  <link rel="icon"
    href="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png">

  <style>
    :root {
      --primary: #6546e8;
      --primary-dark: #5032cc;
      --text: #20243a;
      --muted: #7b8498;
      --border: #e5e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #f1edff, #f8faff, #eaf3ff);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px;
      background: #fff;
      border: 1px solid rgba(229,232,240,.9);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(47, 38, 100, .09);
      animation: appear .5s ease;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-name span {
      color: var(--primary);
    }

    .icon-wrap {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 23px;
      background: #f0edff;
      color: var(--primary);
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }

    h1 {
      margin-bottom: 12px;
      text-align: center;
      font-size: 29px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      min-height: 53px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font: inherit;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(101,70,232,.1);
    }

    button {
      width: 100%;
      min-height: 53px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: .2s;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(101,70,232,.2);
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    .spinner {
      width: 19px;
      height: 19px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    [hidden] {
      display: none !important;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      background: #effbf4;
      border: 1px solid #c6ebd4;
      color: #176c3b;
    }

    .message.error {
      display: block;
      background: #fff3f3;
      border: 1px solid #f3cccc;
      color: #b42318;
    }

    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #edf0f5;
      color: #8a93a5;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 28px 22px; }
      h1 { font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="brand">
      <img
        src="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png"
        alt="EduGM Logo">
      <div class="brand-name">Edu<span>GM</span></div>
    </div>

    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="15" rx="3"/>
        <path d="m4 7 8 6 8-6"/>
        <path d="M16 3v4"/>
        <path d="M14 5h4"/>
      </svg>
    </div>

    <h1>Forgot password?</h1>

    <p class="subtitle">
      No worries! Enter your registered email address and
      we'll send you a secure link to reset your password.
    </p>

    <form id="reset-form">
      <label for="email">Email address</label>

      <div class="input-wrap">
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required>
      </div>

      <button id="submit-btn" type="submit">
        <span id="button-text">Send Reset Link</span>
        <span id="spinner" class="spinner" hidden></span>
      </button>

      <div id="message" class="message"
        role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="index.html">
      &#8592; Back to Sign In
    </a>

    <footer class="footer">
      <strong>EduGM</strong> &mdash; Secure Access. Better Learning.<br>
      &copy; <span id="year"></span> EduGM. All rights reserved.
    </footer>

  </main>

  <script type="module">
    import { initializeApp, getApp, getApps }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    // Use the SAME Firebase project as your login page.
    const firebaseConfig = {
      apiKey: "AIzaSyA9yj3ikv7oIsBhU7IE9XPclY3vul5d9us",
      authDomain: "edugm-bangla.firebaseapp.com",
      projectId: "edugm-bangla",
      storageBucket: "edugm-bangla.firebasestorage.app",
      messagingSenderId: "236553092510",
      appId: "1:236553092510:web:91f03b4434616c06846a8f"
    };

    const app = getApps().length
      ? getApp()
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const form = document.getElementById("reset-form");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("submit-btn");
    const buttonText = document.getElementById("button-text");
    const spinner = document.getElementById("spinner");
    const message = document.getElementById("message");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setLoading(loading) {
      button.disabled = loading;
      spinner.hidden = !loading;
      buttonText.textContent = loading
        ? "Sending reset link..."
        : "Send Reset Link";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address.", "error");
        return;
      }

      message.className = "message";
      message.textContent = "";
      setLoading(true);

      try {
        await sendPasswordResetEmail(auth, email);

        showMessage(
          "If an account exists for this email, a password reset email will be sent. Please check your inbox and spam folder.",
          "success"
        );

      } catch (error) {
        console.error("Password reset error:", error);

        if (
          error.code === "auth/invalid-email"
        ) {
          showMessage(
            "Please enter a valid email address.",
            "error"
          );
        } else if (
          error.code === "auth/too-many-requests"
        ) {
          showMessage(
            "Too many attempts. Please wait and try again later.",
            "error"
          );
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          showMessage(
            "Network error. Check your internet connection and try again.",
            "error"
          );
        } else {
          showMessage(
            "Unable to process your request right now. Please try again later.",
            "error"
          );
        }
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
