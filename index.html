
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Secure EduGM Admin Panel login">
  <title>EduGM Admin Panel — Login</title>
  <link rel="icon" href="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png">

  <style>
    :root {
      --blue: #2457df;
      --blue-dark: #1846bb;
      --cyan: #08a9f5;
      --ink: #172554;
      --muted: #718096;
      --line: #e2e8f0;
      --background: #eef2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    .login-page {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      min-height: 100vh;
    }

    /* Illustration panel */
    .left-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
      padding: 42px;
      background: var(--background);
    }

    .left-panel::before,
    .left-panel::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(37, 99, 235, .08);
      border-radius: 50%;
      pointer-events: none;
    }

    .left-panel::before {
      width: 350px;
      height: 350px;
      top: -190px;
      left: -160px;
    }

    .left-panel::after {
      width: 420px;
      height: 420px;
      right: -220px;
      bottom: -200px;
    }

    .illustration {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 590px;
      max-height: 60vh;
      object-fit: contain;
      mix-blend-mode: multiply;
      animation: appear .5s ease both;
    }

    .left-caption {
      position: relative;
      z-index: 1;
      max-width: 490px;
      margin-top: 25px;
      text-align: center;
    }

    .left-caption h2 {
      margin: 0 0 10px;
      color: #183b9c;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -.8px;
    }

    .left-caption p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    /* Login panel */
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 40px 28px;
      background: #fff;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      animation: appear .45s ease both;
    }

    .logo-area {
      margin-bottom: 32px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 185px;
      height: 115px;
      max-width: 80%;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    .logo-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .form-heading {
      margin-bottom: 27px;
    }

    .form-heading h1 {
      margin: 0 0 8px;
      font-size: 27px;
      letter-spacing: -.7px;
    }

    .form-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 13px;
      font-weight: 650;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      display: block;
      width: 100%;
      height: 49px;
      padding: 0 76px 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #f9fbff;
      color: var(--ink);
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .field input::placeholder { color: #9aa6b8; }

    .field input:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(36, 87, 223, .09);
    }

    .input-action {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 6px;
      border: 0;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .login-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      margin-top: 8px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(100deg, var(--blue), var(--cyan));
      box-shadow: 0 7px 17px rgba(36, 87, 223, .17);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }

    .login-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(36, 87, 223, .24);
    }

    .login-button:disabled {
      opacity: .7;
      cursor: wait;
      transform: none;
    }

    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex: 0 0 auto;
    }

    .spinner[hidden] { display: none; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-radius: 10px;
      background: #fff5f5;
      color: #b42318;
      font-size: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.success {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .secure-note {
      margin-top: 24px;
      color: #8995a8;
      font-size: 11px;
      text-align: center;
    }

    .login-footer {
      margin-top: 30px;
      color: #9aa5b6;
      font-size: 11px;
      text-align: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .login-page { grid-template-columns: 1fr; }
      .left-panel { display: none; }
      .right-panel {
        min-height: 100vh;
        padding: 30px 22px;
      }
      .login-card { max-width: 410px; }
      .logo-area { margin-bottom: 25px; }
      .logo { height: 100px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="login-page">

    <section class="left-panel" aria-label="EduGM introduction">
      <img
        class="illustration"
        src="https://i.postimg.cc/sg8bLvWZ/Collaborative-Coding-in-a-Pastel-Workspace.png"
        alt="Students working together on coding"
      >

      <div class="left-caption">
        <h2>Welcome to EduGM</h2>
        <p>
          Manage educational articles, learning categories,
          official accounts and the EduGM Store in one workspace.
        </p>
      </div>
    </section>

    <section class="right-panel">
      <div class="login-card">

        <div class="logo-area">
          <img
            class="logo"
            src="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png"
            alt="EduGM Learning logo"
          >
          <p class="logo-subtitle">Admin Panel · Secure Sign In</p>
        </div>

        <div class="form-heading">
          <h1>Welcome back</h1>
          <p>Sign in with your approved EduGM staff account.</p>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="username"
                required
              >
              <button class="input-action" id="clear-email" type="button">
                Clear
              </button>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button class="input-action" id="toggle-password" type="button">
                Show
              </button>
            </div>
          </div>

          <button class="login-button" id="login-button" type="submit">
            <span class="spinner" id="spinner" hidden></span>
            <span id="button-label">Login to dashboard</span>
            <span id="button-arrow" aria-hidden="true">→</span>
          </button>

          <div id="message" class="message" role="alert" aria-live="polite"></div>
        </form>

        <div class="secure-note">🔒 Secure sign-in · Approved accounts only</div>
        <div class="login-footer">Need access? Contact your EduGM Owner.</div>

      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9yj3ikv7oIsBhU7IE9XPclY3vul5d9us",
      authDomain: "edugm-bangla.firebaseapp.com",
      projectId: "edugm-bangla",
      storageBucket: "edugm-bangla.firebasestorage.app",
      messagingSenderId: "236553092510",
      appId: "1:236553092510:web:91f03b4434616c06846a8f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("login-button");
    const buttonLabel = document.getElementById("button-label");
    const spinner = document.getElementById("spinner");
    const arrow = document.getElementById("button-arrow");
    const message = document.getElementById("message");

    document.getElementById("toggle-password").addEventListener("click", () => {
      const shouldShow = passwordInput.type === "password";
      passwordInput.type = shouldShow ? "text" : "password";
      document.getElementById("toggle-password").textContent =
        shouldShow ? "Hide" : "Show";
    });

    document.getElementById("clear-email").addEventListener("click", () => {
      emailInput.value = "";
      emailInput.focus();
    });

    function setLoading(loading) {
      loginButton.disabled = loading;
      spinner.hidden = !loading;
      arrow.hidden = loading;
      buttonLabel.textContent = loading
        ? "Signing in..."
        : "Login to dashboard";
    }

    function showMessage(text, success = false) {
      message.textContent = text;
      message.className = success ? "message success" : "message";
      message.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.style.display = "none";
      setLoading(true);

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        const profileSnapshot = await getDoc(
          doc(db, "users", credential.user.uid)
        );

        if (!profileSnapshot.exists()) {
          await signOut(auth);
          showMessage("Your account has not been approved. Contact the EduGM Owner.");
          return;
        }

        const profile = profileSnapshot.data();

        if (profile.active !== true ||
            typeof profile.role !== "string" ||
            profile.role.trim() === "") {
          await signOut(auth);
          showMessage("Your account has not been approved. Contact the EduGM Owner.");
          return;
        }

        showMessage("Login successful. Opening dashboard…", true);
        window.location.assign("dashboard.html");

      } catch (error) {
        const errors = {
          "auth/invalid-credential": "Incorrect email or password.",
          "auth/user-not-found": "No account exists with this email.",
          "auth/wrong-password": "Incorrect email or password.",
          "auth/too-many-requests": "Too many attempts. Please try again later.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "permission-denied": "Firebase denied access to your profile. Check Firestore rules."
        };

        showMessage(
          errors[error.code] ||
          (error.code === "permission-denied"
            ? errors["permission-denied"]
            : "Unable to sign in. Check your Firebase setup and internet connection.")
        );
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
