<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EduGM Admin — Sign in</title><link rel="icon" type="image/png" href="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png"><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <img class="auth-logo" src="https://i.ibb.co/1Y82N0n0/Edu-GM-Learning-Logo.png" alt="EduGM Learning logo"><p class="eyebrow">EDUGM CONTROL CENTRE</p>
    <h1>Welcome back</h1><p class="muted">Sign in with an approved EduGM official account.</p>
    <form id="login-form" class="stack">
      <label>Email address<input id="email" type="email" autocomplete="username" required placeholder="official@edugm.in"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label>
      <button class="btn primary" type="submit">Sign in securely</button>
      <p id="login-error" class="notice error hidden"></p>
    </form>
    <p class="tiny muted">No public registration. Ask the EduGM Owner to approve your account.</p>
  </main>
  <script type="module" src="js/login.js"></script>
</body></html>
